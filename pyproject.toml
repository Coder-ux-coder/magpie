[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "magpie-notes"
version = "0.4.0"
description = "Voice-first notes: say \"notes on\", talk, and the AI of your choice files it, reminds you when it matters, and reviews the videos and articles you save."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Magpie contributors" }]
keywords = ["notes", "voice", "claude", "anthropic", "reminders", "telegram", "pwa", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Processing",
]
dependencies = [
    "anthropic>=1.15,<2",
    "httpx2>=2.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "youtube-transcript-api>=1.2",
    "trafilatura>=2.0",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
# The desktop app (magpie desktop): offline listening, its windows and the tray icon.
desktop = [
    "vosk>=0.3.45",
    "sounddevice>=0.5",
    "pywebview>=6.2",
    "pystray>=0.19",
    "pillow>=10",
    "tzlocal>=5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
magpie = "magpie.cli:main"

[project.urls]
Homepage = "https://github.com/Coder-ux-coder/magpie"
Issues = "https://github.com/Coder-ux-coder/magpie/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:itsdangerous.*"]
