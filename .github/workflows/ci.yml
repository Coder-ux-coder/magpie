name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test
        run: pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/magpie/web/static/js/*.js src/magpie/web/sw.js; do node --check "$f"; done
      - name: Test
        run: node --test "tests/js/*.test.mjs"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t magpie:ci .
      - name: Smoke test
        run: |
          docker run -d --name magpie -p 8000:8000 -e MAGPIE_PASSWORD=ci -e MAGPIE_BRAIN=fake magpie:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs magpie
          exit 1
