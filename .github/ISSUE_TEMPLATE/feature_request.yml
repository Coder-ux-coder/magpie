name: Feature request
description: An idea to make Magpie better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Magpie help?
