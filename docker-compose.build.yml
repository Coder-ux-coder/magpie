# Build Magpie from this folder instead of downloading the published image (for
# developers working on the code):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Automatic updates leave a locally built Magpie alone, so set MAGPIE_AUTO_UPDATE=false
# in .env while you use this, or the updates service replaces it with the published one.
services:
  magpie:
    image: magpie:local
    build: .
    pull_policy: build
